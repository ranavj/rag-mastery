<svg viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="620" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#5b21b6">Parent-Child — INGESTION (data daalte waqt do-level split)</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Ye search se PEHLE hota hai — yahin se "bada parent chunk" banta hai</text>

  <!-- PDF -->
  <rect x="380" y="72" width="160" height="46" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Bajaj PDF (poora doc)</text>
  <line x1="460" y1="118" x2="460" y2="146" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="140" font-size="12" font-style="italic" fill="#7c3aed">split #1: bade tukde</text>

  <!-- PARENTS row -->
  <text x="40" y="170" font-size="14" font-weight="700" fill="#d97706">PARENTS (bade ~2000 char)</text>
  <rect x="120" y="180" width="200" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">PARENT P-2</text>
  <text x="220" y="223" text-anchor="middle" font-size="11" fill="#78350f">"...EMI bounce, charges..."</text>

  <rect x="600" y="180" width="200" height="54" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="700" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">PARENT P-5</text>
  <text x="700" y="223" text-anchor="middle" font-size="11" fill="#78350f">"...late payment, penalty..."</text>

  <line x1="220" y1="234" x2="220" y2="272" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="234" x2="700" y2="272" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="262" font-size="12" font-style="italic" fill="#7c3aed">split #2: har parent → chhote</text>

  <!-- CHILDREN row -->
  <text x="40" y="296" font-size="14" font-weight="700" fill="#2563eb">CHILDREN (chhote ~200 char, + parent_id)</text>
  <rect x="80"  y="308" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="145" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">child C-7</text>
  <text x="145" y="348" text-anchor="middle" font-size="10.5" fill="#374151">parent_id: P-2</text>
  <text x="145" y="362" text-anchor="middle" font-size="10" fill="#6b7280">"charge ₹1000+GST"</text>

  <rect x="230" y="308" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="295" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">child C-8</text>
  <text x="295" y="348" text-anchor="middle" font-size="10.5" fill="#374151">parent_id: P-2</text>
  <text x="295" y="362" text-anchor="middle" font-size="10" fill="#6b7280">"agli EMI ke saath"</text>

  <rect x="560" y="308" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="625" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">child C-19</text>
  <text x="625" y="348" text-anchor="middle" font-size="10.5" fill="#374151">parent_id: P-5</text>
  <text x="625" y="362" text-anchor="middle" font-size="10" fill="#6b7280">"grace period..."</text>

  <rect x="710" y="308" width="130" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="775" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">child C-20</text>
  <text x="775" y="348" text-anchor="middle" font-size="10.5" fill="#374151">parent_id: P-5</text>
  <text x="775" y="362" text-anchor="middle" font-size="10" fill="#6b7280">"penalty clause"</text>

  <!-- STORES -->
  <text x="460" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Do ALAG store me jaate hain 👇</text>

  <!-- children -> chroma -->
  <line x1="220" y1="368" x2="250" y2="446" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="60" y="448" width="360" height="130" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">ChromaDB (vector index)</text>
  <text x="240" y="496" text-anchor="middle" font-size="12" fill="#374151">SIRF children — embed hote hain 🔍</text>
  <rect x="90"  y="510" width="90" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="135" y="530" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">C-7</text>
  <text x="135" y="546" text-anchor="middle" font-size="9" fill="#6b7280">[0.12, 0.88 ...]</text>
  <rect x="195" y="510" width="90" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="240" y="530" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">C-8</text>
  <text x="240" y="546" text-anchor="middle" font-size="9" fill="#6b7280">[0.41, 0.10 ...]</text>
  <rect x="300" y="510" width="90" height="48" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="345" y="530" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">C-19...</text>
  <text x="345" y="546" text-anchor="middle" font-size="9" fill="#6b7280">[0.77, 0.05 ...]</text>

  <!-- parents -> docstore -->
  <line x1="700" y1="234" x2="670" y2="446" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="500" y="448" width="360" height="130" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="680" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Docstore  (bas ek dict!)</text>
  <text x="680" y="496" text-anchor="middle" font-size="12" fill="#374151">SIRF parents — NO embedding 📦</text>
  <rect x="525" y="510" width="310" height="52" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="680" y="530" text-anchor="middle" font-size="12" font-family="monospace" fill="#78350f">"P-2": "...EMI bounce ₹1000+GST..."</text>
  <text x="680" y="548" text-anchor="middle" font-size="12" font-family="monospace" fill="#78350f">"P-5": "...late payment penalty..."</text>

  <text x="460" y="600" text-anchor="middle" font-size="12.5" font-style="italic" fill="#5b21b6">Chroma me search hoti hai (children) · parent_id se docstore se parent uthate hain (lookup, search nahi)</text>
</svg>
