  <circle cx="300" cy="150" r="9" fill="#fbbf24"/><text x="300" y="154" fill="#241a02" font-size="11" font-weight="700" text-anchor="middle">8</text>

  <!-- ============ footer legend ============ -->
  <rect x="24" y="696" width="972" height="48" rx="10" fill="#0e1526" stroke="#334155"/>
  <text x="40" y="716" fill="#cbd5e1" font-size="11" font-weight="700">Safar:</text>
  <text x="40" y="734" fill="#93a4bd" font-size="10.2">1 type → 2 client POST → 3 routes → 4 agent tool chune → 5 retrieval(Chroma) → 6 generation(Claude) → 7 answer wapas → 8 ChatWindow render</text>
  <text x="720" y="716" fill="#a78bfa" font-size="10.5" font-weight="700">⭐ = API contract (2 mirror files)</text>
  <text x="720" y="732" fill="#6ee7b7" font-size="10">📥 ingestion = alag flow (upload). Sab reuse Day 1-18.</text>

