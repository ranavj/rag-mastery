  <text x="148" y="122" fill="#5f7fa5" font-size="10.5" text-anchor="middle">frontend/src/  · Day 23 bharega</text>

  <rect x="42" y="138" width="212" height="60" rx="9" fill="#0e2136" stroke="#1e3a5f"/>
  <text x="148" y="160" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">💬 components/ChatWindow</text>
  <text x="148" y="178" fill="#9fc4e8" font-size="10" text-anchor="middle">user type kare · answer +</text>
  <text x="148" y="191" fill="#9fc4e8" font-size="10" text-anchor="middle">citations + tool_used badge</text>

  <rect x="42" y="214" width="212" height="56" rx="9" fill="#0e2136" stroke="#1e3a5f"/>
  <text x="148" y="236" fill="#e0f2fe" font-size="12" font-weight="700" text-anchor="middle">🔌 api/client.ts</text>
  <text x="148" y="254" fill="#9fc4e8" font-size="10" text-anchor="middle">fetch wrapper — ek jagah se</text>
  <text x="148" y="266" fill="#9fc4e8" font-size="10" text-anchor="middle">backend ko POST /api/chat</text>

  <rect x="42" y="286" width="212" height="58" rx="9" fill="#10233b" stroke="#38bdf8" stroke-dasharray="5 3"/>
  <text x="148" y="308" fill="#bae6fd" font-size="12" font-weight="700" text-anchor="middle">⭐ api/types.ts</text>
  <text x="148" y="326" fill="#9fc4e8" font-size="10" text-anchor="middle">ChatRequest / ChatResponse</text>
  <text x="148" y="338" fill="#9fc4e8" font-size="10" text-anchor="middle">response ka SHAPE (TS interface)</text>

  <!-- contract mirror note -->
  <rect x="42" y="372" width="212" height="150" rx="10" fill="#141c30" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="148" y="394" fill="#c4b5fd" font-size="11.5" font-weight="700" text-anchor="middle">🪞 API CONTRACT = 1 sach, 2 sheeshe</text>
  <text x="148" y="414" fill="#cbd5e1" font-size="10" text-anchor="middle">types.ts (TS) ⇄ schemas.py (Pydantic)</text>
  <text x="148" y="430" fill="#cbd5e1" font-size="10" text-anchor="middle">dono me BILKUL same fields</text>
  <line x1="60" y1="442" x2="236" y2="442" stroke="#33415c" stroke-width="1"/>
  <text x="148" y="460" fill="#93c5fd" font-size="9.5" text-anchor="middle">frontend: response.tool_used ✓</text>
  <text x="148" y="474" fill="#a7f3d0" font-size="9.5" text-anchor="middle">backend: ne wahi field promise kiya</text>
  <text x="148" y="494" fill="#7c8aa5" font-size="9.5" text-anchor="middle">= runtime surprise nahi</text>
  <text x="148" y="510" fill="#7c8aa5" font-size="9.5" text-anchor="middle">(contract pehle, build baad me)</text>

  <!-- ================= BACKEND column ================= -->
  <rect x="300" y="78" width="430" height="600" rx="14" fill="#141026" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="515" y="104" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">③ BACKEND — FastAPI (backend/app/)</text>

