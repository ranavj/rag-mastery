  <rect x="320" y="442" width="390" height="34" rx="8" fill="#3a1a1a" stroke="#f87171"/>
  <text x="515" y="463" fill="#fecaca" font-size="10.5" font-weight="700" text-anchor="middle">🚫 none → honest "jaankari nahi" (no hallucination)</text>

  <!-- retrieval + generation (inside policy_search path) -->
  <rect x="320" y="492" width="185" height="72" rx="9" fill="#10261e" stroke="#34d399"/>
  <text x="412" y="513" fill="#6ee7b7" font-size="11.5" font-weight="700" text-anchor="middle">🔍 retrieval/</text>
  <text x="412" y="529" fill="#a7f3d0" font-size="9.3" text-anchor="middle">retriever.py</text>
  <text x="412" y="544" fill="#a7f3d0" font-size="9.3" text-anchor="middle">Chroma search + threshold</text>
  <text x="412" y="557" fill="#7fcfa8" font-size="8.8" text-anchor="middle">reuse Day 7/15</text>

  <rect x="523" y="492" width="187" height="72" rx="9" fill="#2a1526" stroke="#f472b6"/>
  <text x="616" y="513" fill="#fbcfe8" font-size="11.5" font-weight="700" text-anchor="middle">✍️ generation/</text>
  <text x="616" y="529" fill="#f9a8d4" font-size="9.3" text-anchor="middle">rag_chain.py</text>
  <text x="616" y="544" fill="#f9a8d4" font-size="9.3" text-anchor="middle">chunks + Claude → answer</text>
  <text x="616" y="557" fill="#e88bbf" font-size="8.8" text-anchor="middle">reuse Day 8/9</text>

