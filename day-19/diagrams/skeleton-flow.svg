  <text x="877" y="441" fill="#7fcfa8" font-size="9" text-anchor="middle">padhta (Day 5)</text>

  <rect x="758" y="466" width="238" height="98" rx="12" fill="#2a1526" stroke="#f472b6" stroke-width="1.4"/>
