<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1020" height="760" fill="#0b1220"/>
  <text x="510" y="32" fill="#f8fafc" font-size="21" font-weight="700" text-anchor="middle">🧩 Day 19 Skeleton — kaun file kya karti hai (ek chat sawaal ka safar)</text>
  <text x="510" y="54" fill="#7c8aa5" font-size="12.5" text-anchor="middle">"EMI bounce charge kya hai?" — ye sawaal in files se hoke guzarta hai · number = safar ka step</text>

  <!-- ================= FRONTEND column ================= -->
  <rect x="24" y="78" width="248" height="470" rx="14" fill="#0c1a2e" stroke="#38bdf8" stroke-width="1.5"/>
