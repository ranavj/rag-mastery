  <circle cx="292" cy="188" r="9" fill="#38bdf8"/><text x="292" y="192" fill="#04121f" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="286" y="232" fill="#7dd3fc" font-size="9.5" text-anchor="middle">POST /api/chat</text>
