  <text x="515" y="636" fill="#a7f3d0" font-size="9.8" text-anchor="middle">company_id + page metadata ke saath store</text>
  <text x="515" y="652" fill="#7fcfa8" font-size="9" text-anchor="middle">reuse Day 6 (load/clean) + Day 3 (chunk) + Day 5 (Chroma)</text>

