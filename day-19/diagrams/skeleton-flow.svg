  <text x="515" y="266" fill="#ddd6fe" font-size="12.5" font-weight="700" text-anchor="middle">🧠 agent/agent.py  — LLM KHUD decide</text>
  <text x="515" y="285" fill="#c4b5fd" font-size="10" text-anchor="middle">"kaunsa tool? kya input?" (Day 17-18)</text>
  <text x="515" y="301" fill="#a78bfa" font-size="10" text-anchor="middle">★ ye app ka differentiator</text>

  <!-- teen raaste label -->
  <text x="515" y="332" fill="#8b7fbf" font-size="10.5" text-anchor="middle">↓ agent/tools.py — teen raaste (agent chunta) ↓</text>

  <!-- tool 1 policy_search -->
  <rect x="320" y="342" width="390" height="44" rx="8" fill="#0f2e1e" stroke="#34d399"/>
  <text x="515" y="360" fill="#a7f3d0" font-size="11.5" font-weight="700" text-anchor="middle">🔧 policy_search  (RAG tool)</text>
  <text x="515" y="377" fill="#6ee7b7" font-size="9.5" text-anchor="middle">docs sawaal → retrieval + generation call karta</text>

