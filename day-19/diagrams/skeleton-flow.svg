  <text x="515" y="411" fill="#fde68a" font-size="11.5" font-weight="700" text-anchor="middle">🔧 account_api  (mock live data)</text>
  <text x="515" y="427" fill="#fcd34d" font-size="9.5" text-anchor="middle">"mera balance / EMI / order?" → fake API</text>

