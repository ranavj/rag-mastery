  <circle cx="533" cy="326" r="9" fill="#34d399"/><text x="533" y="330" fill="#04160e" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <!-- 5: policy_search -> retrieval -->
  <line x1="440" y1="386" x2="425" y2="490" stroke="#34d399" stroke-width="2.2" marker-end="url(#ag2)"/>
  <circle cx="416" cy="440" r="9" fill="#34d399"/><text x="416" y="444" fill="#04160e" font-size="11" font-weight="700" text-anchor="middle">5</text>
  <!-- retrieval -> chroma -->
  <line x1="505" y1="520" x2="756" y2="410" stroke="#34d399" stroke-width="1.7" marker-end="url(#ag2)"/>
